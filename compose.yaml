name: joboy-shop

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                APP_NAME: ${DOCKER_APP_NAME:-Joboy Shop}
                APP_ENV: ${DOCKER_APP_ENV:-production}
                APP_DEBUG: ${DOCKER_APP_DEBUG:-false}
                APP_URL: ${DOCKER_APP_URL:-http://localhost:8080}
        image: joboy-shop/app:latest
        restart: unless-stopped
        working_dir: /app
        ports:
            - '${DOCKER_APP_PORT:-8080}:80'
        environment:
            APP_NAME: ${DOCKER_APP_NAME:-Joboy Shop}
            APP_ENV: ${DOCKER_APP_ENV:-production}
            APP_DEBUG: ${DOCKER_APP_DEBUG:-false}
            APP_URL: ${DOCKER_APP_URL:-http://localhost:8080}
            APP_KEY: ${DOCKER_APP_KEY:-}
            LOG_LEVEL: ${DOCKER_LOG_LEVEL:-info}
            LOG_STACK: ${DOCKER_LOG_STACK:-stderr}

            DB_CONNECTION: mariadb
            DB_HOST: mariadb
            DB_PORT: 3306
            DB_DATABASE: ${DOCKER_DB_DATABASE:-joboy_shop}
            DB_USERNAME: ${DOCKER_DB_USERNAME:-joboy}
            DB_PASSWORD: ${DOCKER_DB_PASSWORD:-secret}

            CACHE_STORE: ${DOCKER_CACHE_STORE:-database}
            SESSION_DRIVER: ${DOCKER_SESSION_DRIVER:-database}
            QUEUE_CONNECTION: ${DOCKER_QUEUE_CONNECTION:-database}
            FILESYSTEM_DISK: ${DOCKER_FILESYSTEM_DISK:-local}

            RUN_MIGRATIONS: ${DOCKER_RUN_MIGRATIONS:-true}
            RUN_SEEDERS: ${DOCKER_RUN_SEEDERS:-false}
        volumes:
            - app-storage:/app/storage
        depends_on:
            mariadb:
                condition: service_healthy
        healthcheck:
            test: ['CMD', 'php', '-r', "exit(@fsockopen('127.0.0.1', 80) ? 0 : 1);"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 40s

    mariadb:
        image: mariadb:11.4
        restart: unless-stopped
        command:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
        environment:
            MARIADB_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:-root}
            MARIADB_DATABASE: ${DOCKER_DB_DATABASE:-joboy_shop}
            MARIADB_USER: ${DOCKER_DB_USERNAME:-joboy}
            MARIADB_PASSWORD: ${DOCKER_DB_PASSWORD:-secret}
        volumes:
            - mariadb-data:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 30s
        ports:
            - '${DOCKER_DB_PORT_FORWARD:-3307}:3306'

volumes:
    app-storage:
    mariadb-data:
